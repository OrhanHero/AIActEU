[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiact"
version = "0.1.0"
description = "EU AI Act (Regulation EU 2024/1689) Developer Toolkit and Compliance Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "OrhanHero", email = "security@aiacteu.de" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[project.scripts]
aiact-check = "aiact.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "frontend",
    "backend",
    "node_modules",
    ".venv",
]
