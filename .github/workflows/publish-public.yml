name: Publish Clean Code to Public Repo

on:
  workflow_run:
    workflows: ["Build and Deploy to IONOS via SFTP/FTPS"]
    types: [completed]
  workflow_dispatch:
    inputs:
      reset_history:
        description: >-
          Historie im oeffentlichen Repo verwerfen und durch einen einzigen
          Commit ersetzen (Force-Push). Nur manuell ausloesbar.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-public
  cancel-in-progress: false

env:
  PUBLIC_REPO: OrhanHero/AIActEU-code
  PUBLIC_BRANCH: main

  # Einzige Pflegestelle fuer alles, was zum Deployment gehoert und deshalb im
  # privaten Repo bleibt. Wird sowohl beim Entfernen als auch beim Pruefen
  # verwendet - eine Ergaenzung hier reicht aus.
  DEPLOY_PATHS: |
    .github
    frontend/scripts/deploy.mjs
    frontend/public/.htaccess

  # npm-Pakete, die ausschliesslich deploy.mjs benoetigt. Sie werden aus
  # frontend/package.json entfernt und das Lockfile passend neu erzeugt, damit
  # 'npm ci' im oeffentlichen Repo weiterhin funktioniert.
  DEPLOY_DEPS: basic-ftp ssh2-sftp-client

jobs:
  publish-clean:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check Publish Token
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$PUBLIC_REPO_TOKEN" ]; then
            echo "::error::Secret PUBLIC_REPO_TOKEN fehlt oder ist leer."
            echo "::error::Anlegen unter Settings -> Secrets and variables -> Actions."
            echo "::error::Benoetigt wird ein PAT mit Schreibrecht (Contents: write) auf ${PUBLIC_REPO}."
            exit 1
          fi

      - name: Checkout Private Code
        uses: actions/checkout@v4
        with:
          # Bei workflow_run wird sonst der Default-Branch-HEAD ausgecheckt statt
          # genau des Stands, der gerade erfolgreich deployt wurde.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Clean Snapshot
        run: |
          set -euo pipefail
          rm -rf snapshot
          mkdir snapshot
          # git archive exportiert ausschliesslich versionierte Dateien des
          # Commits - ohne .git-Historie und ohne unversionierte Reste.
          git -C source archive --format=tar HEAD | tar -x -C snapshot

          # 1. Deployment-Pfade entfernen.
          while read -r path; do
            [ -n "$path" ] || continue
            rm -rf "snapshot/$path"
          done <<< "$DEPLOY_PATHS"

          # 2. Env-Dateien entfernen (Beispieldateien bleiben).
          find snapshot \( -name '.env' -o -name '.env.*' \) ! -name '.env.example' -delete

          # 3. Deployment-Abschnitte aus der Dokumentation entfernen.
          while IFS= read -r doc; do
            awk '
              /<!-- deploy-only:start -->/ { skip = 1 }
              !skip                        { print }
              /<!-- deploy-only:end -->/   { skip = 0 }
            ' "$doc" > "$doc.tmp"
            mv "$doc.tmp" "$doc"
          done < <(find snapshot -name '*.md')

          # 4. Deployment-Abhaengigkeiten entfernen und Lockfile angleichen.
          cd snapshot/frontend
          for dep in $DEPLOY_DEPS; do
            npm pkg delete "dependencies.$dep" "devDependencies.$dep"
          done
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify Snapshot
        run: |
          set -euo pipefail
          fail=0

          if [ -e snapshot/.git ]; then
            echo "::error::Private Git-Historie im Snapshot"
            fail=1
          fi

          while read -r path; do
            [ -n "$path" ] || continue
            if [ -e "snapshot/$path" ]; then
              echo "::error::Deployment-Pfad im Snapshot: $path"
              fail=1
            fi
          done <<< "$DEPLOY_PATHS"

          leftover="$(find snapshot \( -name '.env' -o -name '.env.*' \) ! -name '.env.example')"
          if [ -n "$leftover" ]; then
            echo "::error::Env-Dateien im Snapshot:"
            echo "$leftover"
            fail=1
          fi

          if grep -rl 'deploy-only:start' snapshot >/dev/null 2>&1; then
            echo "::error::Nicht entfernte deploy-only-Abschnitte:"
            grep -rl 'deploy-only:start' snapshot
            fail=1
          fi

          for dep in $DEPLOY_DEPS; do
            if grep -q "\"$dep\"" snapshot/frontend/package.json snapshot/frontend/package-lock.json; then
              echo "::error::Deployment-Abhaengigkeit noch vorhanden: $dep"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Snapshot ist sauber."

      - name: Push to Public Repo
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RESET_HISTORY: ${{ github.event.inputs.reset_history }}
        run: |
          set -euo pipefail
          # Das oeffentliche Repo wird geklont und dessen .git behalten, damit nur
          # der Snapshot uebertragen wird - niemals die Historie des privaten Repos.
          git clone --no-checkout \
            "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${PUBLIC_REPO}.git" public
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${RESET_HISTORY:-false}" = "true" ]; then
            # Bewusst verworfene Historie: ein wurzelloser Branch ersetzt per
            # Force-Push alles Bisherige durch genau einen Commit.
            #
            # Gedacht zum Aufraeumen von Alt-Commits. Als Reaktion auf ein
            # geleaktes Geheimnis reicht das NICHT: GitHub haelt unerreichbare
            # Commits noch eine Weile vor und liefert sie ueber die direkte
            # SHA-URL weiter aus, Forks und Caches ebenso. Dann gilt zuerst das
            # Geheimnis rotieren, danach GitHub Support zum Entfernen bitten.
            echo "::warning::Historie von ${PUBLIC_REPO} wird verworfen und durch einen Commit ersetzt."
            git checkout --orphan __reset
            git rm -rq --cached . 2>/dev/null || true
          elif git rev-parse --verify --quiet "origin/${PUBLIC_BRANCH}" >/dev/null; then
            git checkout -B "${PUBLIC_BRANCH}" "origin/${PUBLIC_BRANCH}"
          else
            git checkout --orphan "${PUBLIC_BRANCH}"
          fi

          # Alten Stand loeschen (ohne .git), damit im privaten Repo entfernte
          # Dateien auch oeffentlich verschwinden.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a ../snapshot/. ./
          git add -A

          if [ "${RESET_HISTORY:-false}" = "true" ]; then
            git commit -m "Clean code snapshot from private repo (${SOURCE_SHA})"
            git push --force origin "HEAD:${PUBLIC_BRANCH}"
            exit 0
          fi

          if git diff --cached --quiet; then
            echo "Keine Aenderungen - nichts zu pushen."
            exit 0
          fi
          git commit -m "Sync clean code from private repo (${SOURCE_SHA})"
          git push origin "${PUBLIC_BRANCH}"
