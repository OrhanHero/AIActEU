name: Build and Deploy to IONOS via SFTP/FTPS

on:
  push:
    branches:
      - GoogleAntigravityIDE
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Cache wird im frontend-Unterordner gesucht
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Project
        run: |
          cd frontend
          npm run build

      - name: Deploy to IONOS (SFTP/FTPS Auto-Connect Engine)
        run: |
          cd frontend
          node scripts/deploy.mjs
        env:
          # Sicherer Zusammenbau aus den einzelnen Secrets — schützt User, Host & Pfad vor Log-Leaks!
          SFTP_URL: sftp://${{ secrets.SFTP_USER }}:${{ secrets.SFTP_PASS }};fingerprint=ssh-ed25519-1gx2w8Rtv3wCgi7Jh8myf_KVd72cRQbow03UP8P095Q;x-name=${{ secrets.SFTP_HOST }};x-proxyport=0@${{ secrets.SFTP_HOST }}/${{ secrets.SFTP_PATH }}/
