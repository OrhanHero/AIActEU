name: Build and Deploy to IONOS via SFTP

on:
  push:
    branches:
      - GoogleAntigravityIDE
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Next.js Static Export
        run: npm run build
        working-directory: frontend

      - name: Parse SFTP Credentials & Prepare Environment
        id: sftp_parse
        run: |
          node -e '
            const fs = require("fs");
            function setEnv(key, val) {
              if (val) {
                fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${val}\n`);
              }
            }

            let raw = (process.env.SFTP_URL || process.env.IONOS_URL || process.env.IONOS_SFTP || "").trim();
            
            // Strip quotes if user wrapped string in quotes
            if ((raw.startsWith("\"") && raw.endsWith("\"")) || (raw.startsWith("\'") && raw.endsWith("\'"))) {
              raw = raw.slice(1, -1).trim();
            }

            if (raw) {
              try {
                if (raw.startsWith("{")) {
                  const parsed = JSON.parse(raw);
                  setEnv("SFTP_SERVER", parsed.server);
                  setEnv("SFTP_USERNAME", parsed.username);
                  setEnv("SFTP_PASSWORD", parsed.password);
                  setEnv("SFTP_PORT", parsed.port || "22");
                  setEnv("SFTP_REMOTE_DIR", parsed.remote_dir || "/aiacteu/");
                  console.log("JSON credentials parsed for server:", parsed.server);
                } else {
                  let str = raw;
                  if (!str.includes("://")) {
                    str = "sftp://" + str;
                  }
                  const u = new URL(str);
                  setEnv("SFTP_SERVER", u.hostname);
                  if (u.username) setEnv("SFTP_USERNAME", decodeURIComponent(u.username));
                  if (u.password) setEnv("SFTP_PASSWORD", decodeURIComponent(u.password));
                  setEnv("SFTP_PORT", u.port || "22");
                  const dir = u.pathname && u.pathname !== "/" ? u.pathname : "/aiacteu/";
                  setEnv("SFTP_REMOTE_DIR", dir.endsWith("/") ? dir : dir + "/");
                  console.log("SFTP URL parsed for host:", u.hostname, "user:", u.username ? "***" : "missing");
                }
              } catch (err) {
                console.error("Error parsing SFTP credentials:", err.message);
              }
            } else {
              console.log("No SFTP_URL secret detected yet.");
            }
          '
        env:
          SFTP_URL: ${{ secrets.SFTP_URL }}
          IONOS_URL: ${{ secrets.IONOS_URL }}
          IONOS_SFTP: ${{ secrets.IONOS_SFTP }}
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}

      - name: Sync Static Files to IONOS Webspace via SFTP
        if: ${{ env.SFTP_SERVER != '' && env.SFTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.SFTP_SERVER }}
          username: ${{ env.SFTP_USERNAME }}
          password: ${{ env.SFTP_PASSWORD }}
          port: ${{ env.SFTP_PORT || 22 }}
          protocol: sftp
          local-dir: ./frontend/out/
          server-dir: ${{ env.SFTP_REMOTE_DIR || '/aiacteu/' }}
          security: loose
