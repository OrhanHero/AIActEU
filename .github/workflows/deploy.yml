name: Build and Deploy to IONOS via SFTP/FTPS

on:
  push:
    branches:
      - GoogleAntigravityIDE
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Install Dependencies
        run: npm install
        working-directory: frontend

      - name: Build Next.js Static Export
        run: npm run build
        working-directory: frontend

      - name: Deploy to IONOS (SFTP/FTPS Auto-Connect Engine)
        run: |
          node -e '
            const path = require("path");
            const fs = require("fs");
            const { execSync } = require("child_process");

            let raw = (process.env.SFTP_URL || process.env.IONOS_URL || process.env.IONOS_SFTP || "").trim();
            if ((raw.startsWith("\"") && raw.endsWith("\"")) || (raw.startsWith("\'") && raw.endsWith("\'"))) {
              raw = raw.slice(1, -1).trim();
            }

            let server = process.env.DIRECT_SERVER || "";
            let username = process.env.DIRECT_USERNAME || "";
            let password = process.env.DIRECT_PASSWORD || "";
            let port = parseInt(process.env.DIRECT_PORT || "22", 10);
            let remoteDir = (process.env.DIRECT_DIR || "/aiacteu").replace(/\/+$/, "") || "/aiacteu";

            function safeDecode(str) {
              try { return decodeURIComponent(str); } catch (e) { return str; }
            }

            if (!server && raw) {
              if (raw.startsWith("{")) {
                try {
                  const p = JSON.parse(raw);
                  server = p.server || "";
                  username = p.username || "";
                  password = p.password || "";
                  port = parseInt(p.port || "22", 10);
                  remoteDir = (p.remote_dir || "/aiacteu").replace(/\/+$/, "") || "/aiacteu";
                } catch (e) {}
              } else {
                let clean = raw.replace(/^(sftp|ftps|ftp):\/\//i, "");
                const lastAt = clean.lastIndexOf("@");
                if (lastAt !== -1) {
                  const userPass = clean.substring(0, lastAt);
                  const hostPath = clean.substring(lastAt + 1);
                  const colon = userPass.indexOf(":");
                  if (colon !== -1) {
                    username = safeDecode(userPass.substring(0, colon));
                    password = safeDecode(userPass.substring(colon + 1));
                  } else {
                    username = safeDecode(userPass);
                  }
                  const slash = hostPath.indexOf("/");
                  let hostPort = hostPath;
                  if (slash !== -1) {
                    hostPort = hostPath.substring(0, slash);
                    remoteDir = hostPath.substring(slash).replace(/\/+$/, "") || "/aiacteu";
                  }
                  const hpColon = hostPort.indexOf(":");
                  if (hpColon !== -1) {
                    server = hostPort.substring(0, hpColon);
                    port = parseInt(hostPort.substring(hpColon + 1), 10);
                  } else {
                    server = hostPort;
                    port = 22;
                  }
                } else {
                  server = clean;
                }
              }
            }

            if (!server || !password) {
              console.log("Notice: SFTP_URL or login credentials not provided in GitHub Secrets yet. Skipping deployment.");
              process.exit(0);
            }

            console.log(`Connecting to ${server}:${port} as user "${username}" (Target Dir: ${remoteDir})...`);

            const tmp = fs.mkdtempSync(path.join(require("os").tmpdir(), "deploy-"));
            execSync("npm install ssh2-sftp-client@11.0.0 basic-ftp@5.0.5", { cwd: tmp, stdio: "inherit" });

            const SFTPClient = require(path.join(tmp, "node_modules", "ssh2-sftp-client"));
            const ftp = require(path.join(tmp, "node_modules", "basic-ftp"));
            const localDir = path.resolve("frontend/out");

            async function run() {
              // Attempt 1: SFTP (SSH Port 22)
              try {
                console.log(`[Attempt 1/2] Connecting via SFTP (SSH Port ${port})...`);
                const sftp = new SFTPClient();
                await sftp.connect({
                  host: server,
                  port: port,
                  username: username,
                  password: password,
                  readyTimeout: 20000,
                  retries: 1,
                  algorithms: { serverHostKey: ["ssh-rsa", "ecdsa-sha2-nistp256", "ecdsa-sha2-nistp384", "ecdsa-sha2-nistp521", "ssh-ed25519"] }
                });
                console.log("SFTP Connected successfully! Uploading files...");
                try { await sftp.mkdir(remoteDir, true); } catch (e) {}
                await sftp.uploadDir(localDir, remoteDir);
                await sftp.end();
                console.log("SFTP Upload finished successfully!");
                return;
              } catch (sftpErr) {
                console.log(`SFTP Note: ${sftpErr.message}. Switching to FTPS (TLS Port 21)...`);
              }

              // Attempt 2: FTPS (TLS Port 21)
              console.log(`[Attempt 2/2] Connecting via FTPS (TLS Port 21)...`);
              const ftpClient = new ftp.Client(30000);
              try {
                await ftpClient.access({ host: server, port: 21, user: username, password: password, secure: true, secureOptions: { rejectUnauthorized: false } });
              } catch (e1) {
                await ftpClient.access({ host: server, port: 21, user: username, password: password, secure: false });
              }
              console.log("FTPS Connected successfully! Uploading files...");
              await ftpClient.ensureDir(remoteDir);
              await ftpClient.clearWorkingDir();
              await ftpClient.uploadFromDir(localDir);
              ftpClient.close();
              console.log("FTPS Upload finished successfully!");
            }

            run().catch(err => {
              console.error("Deployment Error Details:", err.stack || err.message);
              process.exit(1);
            });
          '
        env:
          SFTP_URL: ${{ secrets.SFTP_URL }}
          IONOS_URL: ${{ secrets.IONOS_URL }}
          IONOS_SFTP: ${{ secrets.IONOS_SFTP }}
          DIRECT_SERVER: ${{ secrets.SFTP_SERVER }}
          DIRECT_USERNAME: ${{ secrets.SFTP_USERNAME }}
          DIRECT_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          DIRECT_PORT: ${{ secrets.SFTP_PORT }}
          DIRECT_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
