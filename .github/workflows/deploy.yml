name: Build and Deploy to IONOS via SFTP

on:
  push:
    branches:
      - GoogleAntigravityIDE
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install
        working-directory: frontend

      - name: Build Next.js Static Export
        run: npm run build
        working-directory: frontend

      - name: Parse SFTP Credentials & Prepare Environment
        id: sftp_parse
        run: |
          node -e '
            const fs = require("fs");
            function setEnv(key, val) {
              if (val) {
                fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${val}\n`);
              }
            }

            let raw = (process.env.SFTP_URL || process.env.IONOS_URL || process.env.IONOS_SFTP || "").trim();
            if ((raw.startsWith("\"") && raw.endsWith("\"")) || (raw.startsWith("\'") && raw.endsWith("\'"))) {
              raw = raw.slice(1, -1).trim();
            }

            if (raw) {
              try {
                if (raw.startsWith("{")) {
                  const parsed = JSON.parse(raw);
                  setEnv("SFTP_SERVER", parsed.server);
                  setEnv("SFTP_USERNAME", parsed.username);
                  setEnv("SFTP_PASSWORD", parsed.password);
                  setEnv("SFTP_PORT", parsed.port || "22");
                  setEnv("SFTP_REMOTE_DIR", parsed.remote_dir || "/aiacteu/");
                  console.log("JSON credentials parsed for server:", parsed.server);
                } else {
                  let str = raw;
                  if (!str.includes("://")) {
                    str = "sftp://" + str;
                  }
                  const u = new URL(str);
                  setEnv("SFTP_SERVER", u.hostname);
                  if (u.username) setEnv("SFTP_USERNAME", decodeURIComponent(u.username));
                  if (u.password) setEnv("SFTP_PASSWORD", decodeURIComponent(u.password));
                  setEnv("SFTP_PORT", u.port || "22");
                  const dir = u.pathname && u.pathname !== "/" ? u.pathname : "/aiacteu/";
                  setEnv("SFTP_REMOTE_DIR", dir.endsWith("/") ? dir : dir + "/");
                  console.log("SFTP URL parsed for host:", u.hostname);
                }
              } catch (err) {
                console.error("Warning: Failed to parse SFTP_URL format:", err.message);
              }
            } else {
              console.log("No SFTP_URL secret found. Skipping SFTP deployment.");
            }
          '
        env:
          SFTP_URL: ${{ secrets.SFTP_URL }}
          IONOS_URL: ${{ secrets.IONOS_URL }}
          IONOS_SFTP: ${{ secrets.IONOS_SFTP }}
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}

      - name: Deploy to IONOS via Node.js SFTP Client
        if: ${{ env.SFTP_SERVER != '' && env.SFTP_PASSWORD != '' }}
        run: |
          node -e '
            const path = require("path");
            const fs = require("fs");
            const { execSync } = require("child_process");

            const tmp = fs.mkdtempSync(path.join(require("os").tmpdir(), "sftp-"));
            execSync("npm install ssh2-sftp-client@11.0.0", { cwd: tmp, stdio: "inherit" });
            const Client = require(path.join(tmp, "node_modules", "ssh2-sftp-client"));
            const sftp = new Client();

            async function main() {
              const config = {
                host: process.env.SFTP_SERVER,
                port: parseInt(process.env.SFTP_PORT || "22", 10),
                username: process.env.SFTP_USERNAME,
                password: process.env.SFTP_PASSWORD,
                readyTimeout: 30000,
                retries: 2,
                algorithms: {
                  serverHostKey: ["ssh-rsa", "ecdsa-sha2-nistp256", "ecdsa-sha2-nistp384", "ecdsa-sha2-nistp521", "ssh-ed25519"]
                }
              };

              console.log(`Connecting via SFTP to ${config.host}:${config.port} as ${config.username}...`);
              await sftp.connect(config);

              const localDir = path.resolve("frontend/out");
              const remoteDir = process.env.SFTP_REMOTE_DIR || "/aiacteu/";

              console.log(`Syncing local directory (${localDir}) to remote (${remoteDir})...`);
              try { await sftp.mkdir(remoteDir, true); } catch (e) {}

              const result = await sftp.uploadDir(localDir, remoteDir);
              console.log("SFTP Upload finished successfully.");
              await sftp.end();
            }

            main().catch(err => {
              console.error("SFTP Deployment Error:", err.message);
              process.exit(1);
            });
          '
        env:
          SFTP_SERVER: ${{ env.SFTP_SERVER }}
          SFTP_USERNAME: ${{ env.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ env.SFTP_PASSWORD }}
          SFTP_PORT: ${{ env.SFTP_PORT || '22' }}
          SFTP_REMOTE_DIR: ${{ env.SFTP_REMOTE_DIR || '/aiacteu/' }}
