name: Build and Deploy to IONOS via SFTP/FTPS

on:
  push:
    branches:
      - GoogleAntigravityIDE
  schedule:
    # Automatische Ausführung alle 4 Stunden (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          echo "📦 Installing npm dependencies..."
          npm install
          echo "✅ Dependencies installed"
        working-directory: frontend

      - name: Fetch Latest RSS Feeds & Update News Database
        run: |
          echo "📡 Starting news ingestion..."
          node ../scripts/ingest.mjs && echo "✅ Ingestion complete" || echo "⚠️  Ingestion failed (non-fatal)"
          node ../scripts/update-frontend-articles.mjs && echo "✅ Articles updated" || echo "⚠️  Article update failed (non-fatal)"
        working-directory: frontend

      - name: Build Next.js Static Export
        run: |
          echo "🏗️ Copying data directory..."
          cp -r ../data ./data || echo "⚠️ No data dir to copy"
          echo "🚀 Starting Next.js build..."
          npm run build
          echo "✅ Build successful"
          echo "📁 Build output:"
          ls -la out/ | head -20
        working-directory: frontend

      - name: Verify Build Output
        run: |
          if [ ! -d "out" ]; then
            echo "❌ ERROR: Build output directory 'out' not found!"
            exit 1
          fi
          FILE_COUNT=$(find out -type f | wc -l)
          echo "✅ Build output verified: $FILE_COUNT files found"
        working-directory: frontend

      - name: Deploy to IONOS (SFTP/FTPS Auto-Connect Engine)
        working-directory: frontend
        run: |
          echo "🚀 Starting IONOS deployment..."
          node scripts/deploy.mjs
          echo "✅ Deployment complete"
        env:
          SFTP_URL: ${{ secrets.SFTP_URL }}
          IONOS_URL: ${{ secrets.IONOS_URL }}
          IONOS_SFTP: ${{ secrets.IONOS_SFTP }}
          DIRECT_SERVER: ${{ secrets.SFTP_SERVER }}
          DIRECT_USERNAME: ${{ secrets.SFTP_USERNAME }}
          DIRECT_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          DIRECT_PORT: ${{ secrets.SFTP_PORT }}
          DIRECT_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
