name: Build and Deploy to IONOS via SFTP

on:
  push:
    branches:
      - GoogleAntigravityIDE
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCE_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install
        working-directory: frontend

      - name: Build Next.js Static Export
        run: npm run build
        working-directory: frontend

      - name: Parse SFTP Credentials & Prepare Environment
        id: sftp_parse
        run: |
          node -e '
            const fs = require("fs");
            function setEnv(key, val) {
              if (val && typeof val === "string" && val.trim()) {
                fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${val.trim()}\n`);
              }
            }

            try {
              let raw = (process.env.SFTP_URL || process.env.IONOS_URL || process.env.IONOS_SFTP || "").trim();
              if ((raw.startsWith("\"") && raw.endsWith("\"")) || (raw.startsWith("\'") && raw.endsWith("\'"))) {
                raw = raw.slice(1, -1).trim();
              }

              if (raw) {
                if (raw.startsWith("{")) {
                  const parsed = JSON.parse(raw);
                  setEnv("SFTP_SERVER", parsed.server);
                  setEnv("SFTP_USERNAME", parsed.username);
                  setEnv("SFTP_PASSWORD", parsed.password);
                  setEnv("SFTP_PORT", parsed.port || "22");
                  setEnv("SFTP_REMOTE_DIR", (parsed.remote_dir || "/aiacteu").replace(/\/+$/, "") || "/aiacteu");
                  console.log("JSON SFTP credentials parsed for host:", parsed.server);
                } else {
                  let clean = raw.replace(/^(sftp|ftp):\/\//i, "");
                  const lastAt = clean.lastIndexOf("@");
                  if (lastAt !== -1) {
                    const userPass = clean.substring(0, lastAt);
                    const hostPath = clean.substring(lastAt + 1);
                    
                    const colon = userPass.indexOf(":");
                    if (colon !== -1) {
                      setEnv("SFTP_USERNAME", decodeURIComponent(userPass.substring(0, colon)));
                      setEnv("SFTP_PASSWORD", decodeURIComponent(userPass.substring(colon + 1)));
                    } else {
                      setEnv("SFTP_USERNAME", decodeURIComponent(userPass));
                    }

                    const slash = hostPath.indexOf("/");
                    let hostPort = hostPath;
                    let dir = "/aiacteu";
                    if (slash !== -1) {
                      hostPort = hostPath.substring(0, slash);
                      dir = hostPath.substring(slash).replace(/\/+$/, "") || "/aiacteu";
                    }
                    
                    const hostPortColon = hostPort.indexOf(":");
                    if (hostPortColon !== -1) {
                      setEnv("SFTP_SERVER", hostPort.substring(0, hostPortColon));
                      setEnv("SFTP_PORT", hostPort.substring(hostPortColon + 1));
                    } else {
                      setEnv("SFTP_SERVER", hostPort);
                      setEnv("SFTP_PORT", "22");
                    }
                    setEnv("SFTP_REMOTE_DIR", dir);
                    console.log("SFTP URL parsed successfully for user:", userPass.substring(0, colon !== -1 ? colon : 3) + "***");
                  } else {
                    setEnv("SFTP_SERVER", clean);
                    console.log("SFTP Server hostname parsed:", clean);
                  }
                }
              } else {
                console.log("No SFTP_URL secret detected yet.");
              }
            } catch (err) {
              console.log("Notice: SFTP URL parsing note:", err.message);
            }
          '
        env:
          SFTP_URL: ${{ secrets.SFTP_URL }}
          IONOS_URL: ${{ secrets.IONOS_URL }}
          IONOS_SFTP: ${{ secrets.IONOS_SFTP }}
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}

      - name: Deploy to IONOS via Node.js SFTP Client
        if: ${{ env.SFTP_SERVER != '' && env.SFTP_PASSWORD != '' }}
        run: |
          node -e '
            const path = require("path");
            const fs = require("fs");
            const { execSync } = require("child_process");

            const tmp = fs.mkdtempSync(path.join(require("os").tmpdir(), "sftp-"));
            execSync("npm install ssh2-sftp-client@11.0.0", { cwd: tmp, stdio: "inherit" });
            const Client = require(path.join(tmp, "node_modules", "ssh2-sftp-client"));
            const sftp = new Client();

            async function main() {
              const config = {
                host: process.env.SFTP_SERVER,
                port: parseInt(process.env.SFTP_PORT || "22", 10),
                username: process.env.SFTP_USERNAME,
                password: process.env.SFTP_PASSWORD,
                readyTimeout: 35000,
                retries: 3,
                algorithms: {
                  serverHostKey: ["ssh-rsa", "ecdsa-sha2-nistp256", "ecdsa-sha2-nistp384", "ecdsa-sha2-nistp521", "ssh-ed25519"]
                }
              };

              console.log(`Connecting via SFTP to ${config.host}:${config.port} as user "${config.username}"...`);
              await sftp.connect(config);
              console.log("SFTP Connection established!");

              const localDir = path.resolve("frontend/out");
              const remoteDir = process.env.SFTP_REMOTE_DIR || "/aiacteu";

              console.log(`Syncing local directory (${localDir}) to remote (${remoteDir})...`);
              
              // Ensure remote directory exists
              try {
                await sftp.mkdir(remoteDir, true);
              } catch (e) {
                console.log("Remote directory notice:", e.message);
              }

              const result = await sftp.uploadDir(localDir, remoteDir);
              console.log("SFTP Upload finished successfully:", result);
              await sftp.end();
            }

            main().catch(err => {
              console.error("SFTP Deployment Failed:", err.stack || err.message);
              process.exit(1);
            });
          '
        env:
          SFTP_SERVER: ${{ env.SFTP_SERVER }}
          SFTP_USERNAME: ${{ env.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ env.SFTP_PASSWORD }}
          SFTP_PORT: ${{ env.SFTP_PORT || '22' }}
          SFTP_REMOTE_DIR: ${{ env.SFTP_REMOTE_DIR || '/aiacteu' }}
